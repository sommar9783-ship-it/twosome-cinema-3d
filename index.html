<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWOSOME CINEMA 〈딸기 때문에〉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a0b0c;font-family:'Noto Sans KR',system-ui,sans-serif;color:#f6ece2}
  #c{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
  .ui{position:fixed;pointer-events:none;z-index:2}
  .top{top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .brand{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.08em;font-size:15px;color:#f3d79a;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .brand b{font-family:'Noto Sans KR';font-weight:900;letter-spacing:0;color:#fff;margin-left:6px}
  .brand small{display:block;font-family:'Noto Sans KR';font-weight:400;letter-spacing:0;color:rgba(255,255,255,.55);font-size:11px;margin-top:4px}
  .chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(30,10,14,.72);border:1px solid rgba(243,215,154,.25);backdrop-filter:blur(6px);white-space:nowrap}
  .chip.loc{background:#d9a54a;color:#2a0c10;font-weight:700;border-color:#d9a54a}
  .chip.on::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#5ee08a;margin-right:6px;vertical-align:1px}
  .bottom{bottom:22px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 16px}
  .hint{font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.9);max-width:720px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{pointer-events:auto;cursor:pointer;border:none;font:inherit;font-size:14px;font-weight:700;padding:11px 20px;border-radius:999px;background:#d9a54a;color:#2a0c10;box-shadow:0 6px 24px rgba(217,165,74,.3);transition:transform .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:rgba(30,10,14,.75);color:#f6ece2;border:1px solid rgba(243,215,154,.3);box-shadow:none;backdrop-filter:blur(6px)}
  .act{pointer-events:auto;cursor:pointer;border:none;font:inherit;font-size:14px;font-weight:700;padding:11px 20px;border-radius:999px;background:#e8557a;color:#fff;box-shadow:0 6px 24px rgba(232,85,122,.4)}
  .hidden{display:none!important}
  #tip{position:fixed;z-index:3;pointer-events:none;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(20,6,10,.88);border:1px solid rgba(255,255,255,.15);transform:translate(14px,14px);white-space:nowrap}
  #pickPop{position:fixed;z-index:4;transform:translate(-50%,-130%);pointer-events:auto}
  #pickPop button{position:relative;border:none;font:inherit;font-weight:900;font-size:15px;padding:11px 20px;border-radius:999px;background:#fff;color:#c4112b;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
  #pickPop button::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  #toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:6;padding:10px 16px;border-radius:12px;background:rgba(20,6,10,.92);border:1px solid rgba(243,215,154,.3);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #file{display:none}
  #sndBtn{position:fixed;left:18px;top:64px;z-index:4;border:1px solid rgba(243,215,154,.35);background:rgba(30,10,14,.78);color:#f6ece2;font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  #sndBtn.live{background:#d9a54a;color:#2a0c10;border-color:#d9a54a}
  #mixer{position:fixed;left:18px;top:106px;z-index:6;width:300px;max-height:calc(100vh - 200px);overflow:auto;background:rgba(36,8,13,.94);border:1px solid rgba(243,215,154,.3);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
  .mxh{display:flex;justify-content:space-between;align-items:center}.mxh b{font-size:16px}
  .mx-x{border:none;background:rgba(255,255,255,.1);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
  .mxsub{font-size:12px;color:rgba(255,255,255,.55);margin:4px 0 12px}
  .mxmaster{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .mxmute{border:1px solid rgba(243,215,154,.35);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .mxmute.on{background:#e8557a;border-color:#e8557a}
  .mxpre{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.mxpre button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12px;padding:6px 10px;border-radius:999px;cursor:pointer}
  .mxpre button:first-child{background:#d9a54a;color:#2a0c10;border-color:#d9a54a;font-weight:700}
  .mxrow{padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
  .mxtg{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:#fff;font:inherit;cursor:pointer;text-align:left;padding:0}
  .mxn{flex:1;font-size:14px;font-weight:700}.mxn small{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.5)}
  .mxpl{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(255,255,255,.1)}
  .mxrow.on .mxpl{background:#d9a54a;color:#2a0c10}.mxrow:not(.on) .mxn{opacity:.75}
  .mxrow input,.mxmaster input{width:100%;accent-color:#d9a54a}.mxrow input{margin-top:6px;opacity:.5}.mxrow.on input{opacity:1}
  @media (max-width:720px){#mixer{left:10px;right:10px;width:auto}}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:#1a0b0c;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.2em;color:#f3d79a;transition:opacity .6s}
  .dpad{position:fixed;left:18px;bottom:22px;z-index:3;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
  .dpad button{pointer-events:auto;border:1px solid rgba(255,255,255,.2);background:rgba(30,10,14,.7);color:#fff;font-size:20px;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
  @media (pointer:coarse){.dpad{display:grid}.bottom{padding-left:190px}}
  .dpad.force{display:grid}
  /* 모달 */
  #modal{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(10,3,5,.55);backdrop-filter:blur(3px)}
  .sheet{position:relative;width:min(560px,92vw);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#3a0e16,#24080d);border:1px solid rgba(243,215,154,.35);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .sheet h2{font-size:20px;font-weight:900;margin-bottom:4px}
  .sheet .sub{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:16px}
  .sheet .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:.15s}
  .card:hover,.card.sel{border-color:#d9a54a;background:rgba(217,165,74,.14)}
  .card img{width:100%;border-radius:10px;display:block;margin-bottom:8px;background:#fff3}
  .card b{display:block;font-size:13px}.card span{font-size:12px;color:rgba(255,255,255,.6)}
  .note{font-size:11px;color:rgba(255,255,255,.45);margin-top:12px}
  .primary{display:block;width:100%;margin-top:16px;border:none;font:inherit;font-weight:900;font-size:15px;padding:13px;border-radius:12px;background:#d9a54a;color:#2a0c10;cursor:pointer;text-align:center;text-decoration:none}
  .primary:disabled{opacity:.4;cursor:default}
  .seatmap{display:flex;flex-direction:column;gap:5px;align-items:center;margin:6px 0 10px}
  .screenbar{width:70%;height:6px;border-radius:3px;background:rgba(255,255,255,.35);margin-bottom:10px}
  .srow{display:flex;gap:4px;align-items:center}
  .srow i{width:18px;font-style:normal;font-size:11px;color:rgba(255,255,255,.5)}
  .seat{width:24px;height:20px;border-radius:5px 5px 3px 3px;border:none;background:#9a1e2c;cursor:pointer;font-size:9px;color:#fff8}
  .seat.taken{background:#4a3a3c;cursor:not-allowed}
  .seat.sel{background:#d9a54a;color:#2a0c10}
  .gap{width:14px}
  .check{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px;cursor:pointer}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
  .opt{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
  .opt.sel{background:#d9a54a;color:#2a0c10;border-color:#d9a54a;font-weight:700}
  .opt:disabled{opacity:.35;cursor:default}
  .lbl{font-size:12px;font-weight:700;color:#f3d79a;margin-top:6px}
  .bigimg{width:100%;border-radius:14px;display:block;margin-bottom:12px}
  ul.cond{font-size:13px;line-height:1.7;padding-left:18px;color:rgba(255,255,255,.85)}
  .copy{font-size:26px;font-weight:900;text-align:center;margin:4px 0 14px;color:#fff}
  /* 사이드 패널(포토부스) */
  #panel{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:5;width:280px;background:rgba(36,8,13,.92);border:1px solid rgba(243,215,154,.3);border-radius:18px;padding:18px;backdrop-filter:blur(8px)}
  #panel h3{font-size:16px;font-weight:900;margin-bottom:6px}
  @media (max-width:720px){#panel{top:auto;bottom:110px;transform:none;right:10px;left:10px;width:auto;max-height:40vh;overflow:auto}}
  #count{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:900;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6);pointer-events:none}
  #flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
  #photoOut{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,3,5,.6);gap:14px}
  #photoOut .slot{width:min(300px,70vw);height:10px;border-radius:5px;background:#120406;box-shadow:inset 0 2px 4px #000}
  #photoOut .clip{width:min(280px,64vw);overflow:hidden;margin-top:-8px}
  #photoOut img{width:100%;display:block;border-radius:6px;transform:translateY(-100%);animation:print 2.2s cubic-bezier(.3,.7,.3,1) forwards;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  @keyframes print{to{transform:translateY(0)}}
  #photoOut .btns{pointer-events:auto}
  #moleHud{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px}
  #moleHud span{font-size:16px;font-weight:900;padding:8px 14px;border-radius:12px;background:rgba(20,6,10,.85);border:1px solid rgba(243,215,154,.3)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div style="text-align:center">TWOSOME CINEMA<div id="loadPct" style="margin-top:14px;font-size:11px;opacity:.7">0%</div></div></div>

<div class="ui top">
  <div class="brand">TWOSOME CINEMA<b>〈딸기 때문에〉</b><small>투썸 딸기 시즌 가상 영화관 · 제안용 프로토타입</small></div>
  <div class="chips">
    <div class="row"><span class="chip loc" id="locChip">로비</span><span class="chip on" id="onlineChip">오프라인 데모</span></div>
    <div class="row" id="inv"></div>
  </div>
</div>

<div class="ui bottom">
  <div class="hint" id="hint"></div>
  <button class="act hidden" id="actBtn"></button>
  <div class="btns">
    <button class="btn ghost hidden" id="viewBtn">👀 내 캐릭터 보기</button>
    <button class="btn hidden" id="enterBtn">상영관 입장</button>
    <button class="btn ghost hidden" id="cupBtn">컵홀더에 놓기</button>
    <button class="btn ghost hidden" id="sipBtn">🥤 음료 마시기</button>
    <button class="btn ghost hidden" id="camBtn">🎥 카메라: 수동</button>
    <button class="btn ghost hidden" id="underBtn">의자 밑 살펴보기</button>
    <button class="btn ghost hidden" id="waveBtn">👋 손 흔들기</button>
    <label class="btn ghost hidden" id="loadBtn" for="file">캠페인 영상 세팅</label>
    <button class="btn ghost hidden" id="standBtn">자리에서 일어나기</button>
    <button class="btn ghost hidden" id="lobbyBtn">로비로 나가기</button>
    <button class="btn ghost hidden" id="backBtn">돌아가기 (Esc)</button>
  </div>
</div>
<input type="file" id="file" accept="video/*">
<div class="dpad"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><button data-k="d">▼</button><button data-k="r">▶</button></div>
<div id="tip" class="hidden"></div>
<div id="pickPop" class="hidden"><button id="pickBtn">🍓 줍기</button></div>
<div id="toast"></div>
<button id="sndBtn" aria-label="로비 사운드 열기">🔇 로비 사운드</button>
<div id="mixer" class="hidden"></div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="panel" class="hidden"></div>
<div id="count" class="hidden"></div>
<div id="flash"></div>
<div id="photoOut" class="hidden"></div>
<div id="moleHud" class="hidden"><span id="moleTime">⏱ 20.0</span><span id="moleScore">🍓 0점</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('loading').textContent='3D 라이브러리를 불러오지 못했어요';return;}
const $=id=>document.getElementById(id);
const canvas=$('c');
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const F="'Noto Sans KR',sans-serif";
const posterMeshes=[], COLLIDERS=[], PROPS=[];

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
let PR=Math.min(devicePixelRatio,1.5),prAcc=0,prN=0;renderer.setPixelRatio(PR);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.84;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.physicallyCorrectLights=false;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a0b0c);
scene.fog=new THREE.Fog(0x1a0b0c,34,70);
const camera=new THREE.PerspectiveCamera(60,1,0.05,120);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?78:60;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// 따뜻한 반사광 환경맵 (금속·광택 재질용)
{ const pm=new THREE.PMREMGenerator(renderer), es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(20,24,12),new THREE.MeshBasicMaterial({side:THREE.BackSide,color:0x1e0c09})));
  const lamp=(w,h,x,y,z,r,g,b)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));m.material.color.setRGB(r,g,b);m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m);};
  lamp(10,4,0,12,0,2.6,1.9,1.2);lamp(4,4,12,3,4,1.2,.8,.5);lamp(4,4,-12,3,-4,1.2,.8,.5);
  scene.environment=pm.fromScene(es,.04).texture;
}

const std=(color,opt={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:0},opt));
const box=(w,h,d,mat,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m;};
const mesh=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);scene.add(m);return m;};
function textTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function plane(w,h,tex,x,y,z,basic=true){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),basic?new THREE.MeshBasicMaterial({map:tex,toneMapped:false}):new THREE.MeshStandardMaterial({map:tex,roughness:.6}));m.position.set(x,y,z);scene.add(m);return m;}

// =====================================================================
// 에셋: 뷰 이미지(assets/views/<이름>_f|s|b.png) → 소품 겉면,  GLB(assets/models/<이름>.glb) → 있으면 통째로 교체
// =====================================================================
const VIEW={};
const VIEW_KEYS=['kiosk_f','kiosk_s','kiosk_b','claw_f','claw_s','claw_b','booth_f','booth_s','door_f','plant_f','table_f','berry_f','char_f','loc_f'];
// 벽지·바닥: assets/textures/wall1.jpg (패널+액자 벽 디자인), floor.jpg (바닥재). 없으면 기존 코드 그림을 씀
let WALL=null, FLOOR=null, WALLT=null, CARPET=null;
// 실제 제품 사진·로고·캠페인 포스터 (assets/textures). 없으면 기존 그림으로 대신함
const PH={},PH_FILES={main:'poster_1.webp',p2:'poster_2.webp',p3:'poster_3.webp',cake1:'cake1.jpg',cake2:'cake2.jpg',cake3:'cake3.jpg',cake4:'cake4.jpg',drink1:'drink1.webp',drink2:'drink2.webp',logoW:'logo_w.webp',logoB:'logo_b.webp'};
const loadPhotos=()=>Promise.all(Object.keys(PH_FILES).map(k=>loadImg('assets/textures/'+PH_FILES[k]).then(im=>{if(im)PH[k]=im;})));
// 흰 배경 사진을 밝은 바탕 위에 자연스럽게 올림(곱하기 합성). (cx,cy) 중심, 한 변 s
function drawPhoto(c,im,cx,cy,s){c.save();c.globalCompositeOperation='multiply';const k=s/Math.max(im.width,im.height);c.drawImage(im,cx-im.width*k/2,cy-im.height*k/2,im.width*k,im.height*k);c.restore();}
// 투썸 로고를 원하는 색으로: 흰 로고 이미지를 색칠해서 그림. (cx,cy) 중심, 폭 w
function drawLogo(c,cx,cy,w,color){const im=PH.logoW;if(!im){c.save();c.fillStyle=color;c.font="900 "+Math.round(w*.2)+"px 'Noto Sans KR',sans-serif";c.textAlign='center';c.textBaseline='middle';c.fillText('TWOSOME',cx,cy);c.restore();return;}
  const h=w*im.height/im.width,t=document.createElement('canvas');t.width=Math.ceil(w);t.height=Math.ceil(h);const x=t.getContext('2d');x.drawImage(im,0,0,t.width,t.height);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,t.width,t.height);c.drawImage(t,cx-w/2,cy-h/2);} // WALLT: 상영관 벽 한 칸(wall_theater.jpg), CARPET: 상영관 바닥 카펫(carpet.jpg)
// 재질 텍스처 (assets/textures/m_*.jpg, 시드림 5.5 생성): UV 없이 표면에 세 방향으로 투영해 입힘 → 어떤 모양에도 늘어짐 없이 붙음

function drawBerry(c,x,y,s,rot,face){
  c.save();c.translate(x,y);c.rotate(rot||0);c.scale(s,s);
  const g=c.createRadialGradient(-.3,-.35,.05,0,0,1.15);g.addColorStop(0,'#ff6b7d');g.addColorStop(1,'#c4112b');

  if(!face){c.fillStyle='#ffe27a';for(const[sx,sy]of SEEDS){c.beginPath();c.ellipse(sx,sy,.045,.075,0,0,7);c.fill();}}
  else{c.fillStyle='#ffe27a';for(const[sx,sy]of SEEDS){if(sy>-.3&&sy<.3&&Math.abs(sx)<.45)continue;c.beginPath();c.ellipse(sx,sy,.04,.065,0,0,7);c.fill();}
    c.fillStyle='#2a0a10';for(const ex of[-.24,.24]){c.beginPath();c.arc(ex,-.12,.09,0,7);c.fill();}
    c.fillStyle='#fff';for(const ex of[-.21,.27]){c.beginPath();c.arc(ex,-.15,.03,0,7);c.fill();}
    c.fillStyle='rgba(255,170,190,.85)';for(const ex of[-.42,.42]){c.beginPath();c.ellipse(ex,.08,.11,.06,0,0,7);c.fill();}

  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-.45,-.38,.1,.2,-.5,0,7);c.fill();

let filmMode='idle', filmStart=0, video=null, videoTex=null, paused=false, pauseAt=0;
const FALL=[...Array(70)].map(()=>({x:Math.random(),y:Math.random(),sp:40+Math.random()*90,d:.3+Math.random()*.7,r:Math.random()*6,rs:(Math.random()-.5)*1.4,sw:Math.random()*6})).sort((a,b)=>a.d-b.d);
const CAPS=['〈딸기 때문에〉','딸기 때문에, 오늘도 설레요','TWOSOME CINEMA','딸기 때문에, 한 입 더.'];
const FILM_LEN=30;
function drawFall(c,W,H,s,alpha){
  for(const b of FALL){const y=((b.y*(H+200)+s*b.sp*b.d)%(H+200))-100;const x=b.x*W+Math.sin(s*.8+b.sw)*20*b.d;
    c.globalAlpha=alpha*(.45+.55*b.d);drawBerry(c,x,y,10+b.d*32,b.r+s*b.rs);}
  c.globalAlpha=1;
}
function drawFilm(now){
  const W=800,H=600,c=fx,F="'Noto Sans KR',sans-serif";
  c.textAlign='center';c.textBaseline='middle';
  if(filmMode==='idle'){
    const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a1020');g.addColorStop(1,'#0e0810');c.fillStyle=g;c.fillRect(0,0,W,H);
    drawFall(c,W,H,now/1000*.4,.25);
    c.fillStyle='#ff8fab';c.font=`700 30px ${F}`;c.fillText('NOW SHOWING · 〈딸기 때문에〉',W/2,H/2-80);
    c.fillStyle='#fff';c.font=`900 72px ${F}`;c.fillText('곧 상영이 시작됩니다',W/2,H/2);
    c.fillStyle='rgba(255,255,255,.6)';c.font=`400 30px ${F}`;c.fillText('예매한 자리에 앉아 상영을 기다려주세요',W/2,H/2+70);
    return;
  }
  if(filmMode==='end'){
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a0e16');g.addColorStop(1,'#14060a');c.fillStyle=g;c.fillRect(0,0,W,H);
    drawFall(c,W,H,now/1000*.3,.3);
    c.fillStyle='#f3d79a';c.font="700 64px 'Cinzel',serif";c.fillText('THE END',W/2,H/2-30);
    c.fillStyle='#fff';c.font=`700 34px ${F}`;c.fillText('딸기 때문에, 한 입 더.',W/2,H/2+50);return;}
  const t=((paused?pauseAt:now)-filmStart)/1000;
  if(t<5){ // 카운트다운 리더
    c.fillStyle='#e9b7c0';c.fillRect(0,0,W,H);
    const f=t%1;c.fillStyle='#d28f9c';c.beginPath();c.moveTo(W/2,H/2);c.arc(W/2,H/2,700,-Math.PI/2,-Math.PI/2+f*Math.PI*2);c.fill();
    c.strokeStyle='#5a1a26';c.lineWidth=4;c.beginPath();c.moveTo(0,H/2);c.lineTo(W,H/2);c.moveTo(W/2,0);c.lineTo(W/2,H);c.stroke();
    for(const r of[200,240]){c.beginPath();c.arc(W/2,H/2,r,0,7);c.stroke();}
    c.fillStyle='#4a0f1c';c.font=`900 260px ${F}`;c.fillText(String(5-Math.floor(t)),W/2,H/2+10);
    for(let i=0;i<40;i++){c.fillStyle=`rgba(80,0,20,${Math.random()*.3})`;c.fillRect(Math.random()*W,Math.random()*H,Math.random()*3,Math.random()*30);}
    return;
  }
  if(videoPending&&video){videoPending=false;screenMat.map=videoTex;screenMat.needsUpdate=true;video.muted=false;video.play().catch(()=>{video.muted=true;video.play().catch(()=>{});});return;}
  const s=t-5, hue=345+Math.sin(s*.15)*12;
  if(s>FILM_LEN&&filmMode==='film'){filmMode='end';onFilmEnd();return;}
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${hue},100%,91%)`);g.addColorStop(1,`hsl(${hue},95%,76%)`);c.fillStyle=g;c.fillRect(0,0,W,H);
  // 보케
  for(let i=0;i<14;i++){const bx=(i*211+s*12)%W,by=(i*97)%H*.7;c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(bx,by,30+(i%4)*18,0,7);c.fill();}
  drawFall(c,W,H,s,1);
  // 딸기밭 (스크롤)
  for(let layer=0;layer<2;layer++){
    const base=H*(.74+layer*.1), sp=30+layer*40, col=layer?'#4f9a43':'#7cc46a';
    c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=10){const X=x+s*sp;c.lineTo(x,base+Math.sin(X/120+layer*3)*18);}c.lineTo(W,H);c.fill();
    for(let k=-1;k<16;k++){const X=((k*110-s*sp)%(W+220)+W+220)%(W+220)-110;const yy=base+Math.sin((X+s*sp)/120+layer*3)*18;
      drawBerry(c,X,yy+8+layer*6,14+layer*8,Math.sin(k)*.3);}
  }
  // 주인공 딸기 (통통 튀기)
  const hop=Math.abs(Math.sin(s*2.6)), sq=1+(1-hop)*.08;
  c.save();c.translate(W/2,H*.62-hop*90);c.scale(1/sq,sq);drawBerry(c,0,0,95,Math.sin(s*1.3)*.08,true);c.restore();
  // 자막
  const ci=Math.floor(s/7)%CAPS.length, cp=s%7, ta=cp<1?cp:cp<5.5?1:cp<6.5?6.5-cp:0;
  if(ta>0){c.globalAlpha=ta;c.fillStyle='#fff';c.font=`900 ${ci===0?78:60}px ${F}`;c.shadowColor='rgba(170,0,40,.55)';c.shadowBlur=18;c.fillText(CAPS[ci],W/2,H*.18);c.shadowBlur=0;c.globalAlpha=1;}
  c.fillStyle='#000';c.fillRect(0,0,W,24);c.fillRect(0,H-24,W,24);
}

function updateInteract(dt,now){

  if(!act)return;act.t+=dt;const t=act.t;
  if(act.type==='pick'){
    meSt.crouch=act.seated?0:Math.sin(Math.min(1,t/.9)*Math.PI)*.16;meSt.armOv[1]=t<.9?-1.1:null;
    const h=act.h;if(t>.3&&t<.8)fly(h.m,me.items.berry.getWorldPosition(_p),(t-.3)/.5,.15);
    if(t>=.8&&!act.got){act.got=true;removeHidden(h);me.items.berry.visible=true;meSt.cheer=.6;renderInv();publishPresence(true);
      toast('🍓 딸기 한 알 획득! 로비 가운데 케이크에 올려보세요');setTimeout(()=>spawnHidden(!!h.spot.aud),6000);}
    if(t>1.1){meSt.crouch=0;const seated=act.seated;act=null;meSt.armOv=[null,null];if(!seated)backToFree();else ui();}
  }else if(act.type==='cafe'&&act.phase==='brew'){
    cafeM.bar.st=cafeM.bar.st||{walking:false,seated:false,cheer:0,wave:0,armOv:[null,null]};
    cafeM.bar.st.armOv=t<2.2?[-1.2+Math.sin(t*9)*.3,-1+Math.cos(t*7)*.3]:[null,null];
    const pc=cafeM.pickCup;
    if(t>1.6&&!pc.visible){pc.visible=true;pc.userData.liq.material.color.setHex(DRINKS[act.drink].liquid);pc.scale.setScalar(.01);}
    if(pc.visible&&t<2.1)pc.scale.setScalar(1.4*Math.min(1,(t-1.6)/.3));
    if(t>2.2&&!act.called){act.called=true;toast('🔔 주문하신 '+DRINKS[act.drink].name+' 나왔습니다!');hint('픽업대에서 음료를 받아요');
      travel([{to:V(-4.5,0,12.25),...stayCam()},{to:V(-4.5,0,12.25),yaw:-Math.PI/2,idle:true,dur:.4,...stayCam()}],()=>{act.phase='take';act.t=0;});}
  }else if(act.type==='cafe'&&act.phase==='take'){
    const pc=cafeM.pickCup;meSt.armOv[0]=t<.8?-1.3:null;
    if(t>.2&&!pc.userData.flying){pc.userData.flying=true;scene.attach(pc);pc.userData.from=pc.position.clone();}
    if(pc.userData.flying&&t<.8)fly(pc,me.items.drink.getWorldPosition(_p),Math.min(1,(t-.2)/.5),.15);
    if(t>=.8&&!act.got){act.got=true;pc.visible=false;pc.userData.flying=false;cafeM.g.attach(pc);pc.position.set(1.45,1.16,.92);pc.rotation.set(0,0,0);
      setDrink(me,act.drink);meSt.cheer=.8;renderInv();publishPresence(true);toast('🥤 '+DRINKS[act.drink].name+' 획득! 들고 상영관에 가볼까요?');}
    if(t>1.8)endInteract(true);
  }else if(act.type==='ticket'&&act.phase==='print'){
    const K=act.pr.K;drawKiosk(K,'done',act.txt,t);const tk=K.ticket;
    if(t<.8){tk.visible=true;tk.position.set(0,K.ty||.85,(K.tz||.2)+t/.8*.2);}
    if(t>=1&&t<1.7){meSt.armOv[0]=-1.35;if(!tk.userData.flying){tk.userData.flying=true;scene.attach(tk);tk.userData.from=tk.position.clone();}
      fly(tk,me.items.ticket.getWorldPosition(_p),Math.min(1,(t-1.1)/.5),.15);}
    if(t>=1.7&&!act.got){act.got=true;tk.visible=false;tk.userData.flying=false;K.g.attach(tk);tk.position.set(0,.85,.2);tk.rotation.set(-Math.PI/2,0,0);
      meSt.armOv[0]=null;meSt.cheer=.8;renderInv();toast('🎟 '+act.txt+' 발권 완료! 상영관 입구에서 티켓을 태그해요');}
    if(t>2.8)endInteract(true);
  }else if(act.type==='claw'){
    const c=claw;
    if(!c.busy&&!act.reward){const sp=.55*dt;
      c.carriage.position.x=Math.max(-.5,Math.min(.5,c.carriage.position.x+((pad.r||keys.r?1:0)-(pad.l||keys.l?1:0))*sp));
      c.carriage.position.z=Math.max(-.4,Math.min(.4,c.carriage.position.z+((pad.d||keys.d?1:0)-(pad.u||keys.u?1:0))*sp));}
    if(act.reward){const R=act.reward;R.t+=dt;const k=Math.min(1,R.t/.8);fly(R.obj,me.root.position.clone().add(V(0,1.0,0)),k,.4);R.obj.rotation.y+=dt*8;
      if(k>=1){scene.remove(R.obj);dolls.push(R.type);meSt.cheer=1;act.reward=null;renderInv();
        toast(`🎉 ${R.type==='cake'?'미니 케이크 인형':'딸기 쿠션'} 획득! 포토부스에서 소품으로 들 수 있어요`);hint('한 번 더? 방향키 + 스페이스바');show('actBtn',true);ui();if(pendingPick)setTimeout(()=>endInteract(true),900);}}
  }else if(act.type==='cake'&&act.phase==='place'){
    const C=act.pr.C;meSt.armOv[1]=t<1?-2.0:null;
    if(t>.25&&!act.flyObj){const b=makeSmallBerry(1);me.items.berry.getWorldPosition(b.position);scene.add(b);b.userData.from=b.position.clone();act.flyObj=b;me.items.berry.visible=false;renderInv();publishPresence(true);
      const [x,y,z]=cakeSlot(Math.min(cakeTotal(C.k),239));act.slot=V(C.x+x,C.top+y,C.z+z);}
    if(act.flyObj&&t<1.0)fly(act.flyObj,act.slot,Math.min(1,(t-.25)/.6),.45);
    if(t>=1.0&&!act.got){act.got=true;scene.remove(act.flyObj);const before=cakeTotal(C.k);addBerry(C.k);const after=cakeTotal(C.k);meSt.cheer=.9;
      toast(after>=12&&before<12?`✨ ${CAKES[C.k].name} 첫 층 완성! 실제 제품 모양이 됐어요`:`🍓 ${CAKES[C.k].name}에 올렸어요 · 지금 ${after}개`);}
    if(t>2.0)endInteract(true);
  }
}

let dbNs=null, uid=null, canWrite=true, shared=[0,0,0], mine=[0,0,0], localExtra=[0,0,0], writing=Promise.resolve();
try{const s=JSON.parse(localStorage.getItem('tw-berry-local')||'null');if(Array.isArray(s)&&s.length===3)localExtra=s.map(n=>Math.max(0,Math.min(9999,n|0)));}catch(e){}
let peerCk=[0,0,0];
function cakeTotal(k){return shared[k]+localExtra[k]+peerCk[k];}
function refreshCakes(){cakeM.forEach(C=>renderCake(C,cakeTotal(C.k)));}
function addBerry(k){
  if(dbNs&&uid&&canWrite){mine[k]++;shared[k]++;refreshCakes();const body={a:mine[0],b:mine[1],c:mine[2],t:Date.now()};
    writing=writing.then(()=>dbNs.doc('cake/'+uid).set(body)).catch(()=>{canWrite=false;mine[k]--;shared[k]--;localExtra[k]++;saveLocal();refreshCakes();});}
  else{localExtra[k]++;saveLocal();refreshCakes();}
  publishPresence(true);
}
function saveLocal(){try{localStorage.setItem('tw-berry-local',JSON.stringify(localExtra));}catch(e){}}
async function initDb(){
  const C=window.claude;if(!C||!C.use)return;
  try{const [db,user]=await Promise.all([C.use('db'),C.use('user')]);if(!db)return;dbNs=db;uid=user?await user.id():null;
    if(user&&user.can){try{const w=await user.can('data.write');if(w===false)canWrite=false;}catch(e){}}
    db.collection('cake').onSnapshot(snap=>{const t=[0,0,0];let m=null;
      for(const d of snap.docs){const v=d.data()||{};const n=k=>Math.max(0,Math.min(10000,Math.floor(+v[k]||0)));t[0]+=n('a');t[1]+=n('b');t[2]+=n('c');if(d.id===uid)m=[n('a'),n('b'),n('c')];}
      shared=t;if(m)mine=m;refreshCakes();},()=>{});
  }catch(e){}
}

// 실시간 관객 (room presence)
// =====================================================================
let roomNs=null;const peerAv=new Map(), peerSeatSet=new Set();let lastPres='',lastPresT=0;
function presenceObj(){const p=me.root.position;return{x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),r:+meYaw.toFixed(2),
  a:seatedPose?'s':(moving||keyWalk)?'w':'i',b:me.items.berry.visible?1:0,d:me.items.drink.visible?me.drinkKind:-1,tp:me.topperType||'',
  tk:hasTicket()?myTicket.seats.join(','):'',wv:Math.round(lastWave/100),sh:myShirt,ck:localExtra.slice()};}
const myShirt=0;let lastWave=0;
function publishPresence(force){if(!roomNs)return;const now=performance.now();if(!force&&now-lastPresT<120)return;const o=presenceObj(),s=JSON.stringify(o);if(s===lastPres)return;lastPres=s;lastPresT=now;roomNs.presence(o).catch(()=>{});}
async function initRoom(){
  const C=window.claude;if(!C||!C.use)return;
  try{const r=await C.use('room');if(!r)return;roomNs=r;
    r.onPeers(ch=>{
      const ids=new Set();let n=0;
      for(const p of ch.peers){if(p.kind!=='viewer')continue;n++;if(p.isMe)continue;ids.add(p.peer);
        let P=peerAv.get(p.peer);const pr=p.presence||{};
        if(!P){const sh=Number.isInteger(pr.sh)?pr.sh:Math.abs(hashStr(p.peer))%SHIRTS.length;P={A:makeAvatar({outfit:Math.abs(hashStr(p.peer))%OUTFITS.length,pants:PANTS[Math.abs(hashStr(p.peer))%PANTS.length],lite:true}),st:{walking:false,seated:false,cheer:0,wave:0},tgt:V(0,0,17),yaw:0,init:false,wv:0};scene.add(P.A.root);peerAv.set(p.peer,P);}
        const num=v=>typeof v==='number'&&isFinite(v)?v:null;
        if(num(pr.x)!==null&&num(pr.z)!==null){P.tgt.set(Math.max(-10,Math.min(10,pr.x)),num(pr.y)||0,Math.max(-20,Math.min(26,pr.z)));P.yaw=num(pr.r)||0;if(!P.init){P.A.root.position.copy(P.tgt);P.init=true;}}
        P.st.seated=pr.a==='s';P.st.walkingFlag=pr.a==='w';
        P.A.items.berry.visible=pr.b===1;setDrink(P.A,Number.isInteger(pr.d)&&pr.d>=0&&pr.d<3?pr.d:-1);
        setTopper(P.A,TOPPERS.some(t=>t[0]===pr.tp)?pr.tp||null:null);
        if(typeof pr.wv==='number'&&pr.wv!==P.wv){if(P.wv)P.st.wave=1.6;P.wv=pr.wv;}
        P.ck=Array.isArray(pr.ck)&&pr.ck.length===3?pr.ck.map(n=>Math.max(0,Math.min(500,Math.floor(+n||0)))):[0,0,0];
        P.tk=typeof pr.tk==='string'?pr.tk.split(',').filter(c=>/^[A-G](1[0-2]|[1-9])$/.test(c)):[];
      }
      for(const [k,P] of peerAv)if(!ids.has(k)){scene.remove(P.A.root);peerAv.delete(k);}
      peerSeatSet.clear();const pc=[0,0,0];for(const P of peerAv.values()){(P.tk||[]).forEach(c=>peerSeatSet.add(c));(P.ck||[0,0,0]).forEach((n,i)=>pc[i]+=n);}
      if(pc.join()!==peerCk.join()){peerCk=pc;refreshCakes();}
      $('onlineChip').textContent='실시간 관객 '+Math.max(1,n)+'명';
    },()=>{$('onlineChip').textContent='오프라인 데모';});
    publishPresence(true);
  }catch(e){}
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}
function updatePeers(dt,now){
  for(const P of peerAv.values()){const p=P.A.root.position,d=p.distanceTo(P.tgt);
    p.lerp(P.tgt,Math.min(1,dt*8));P.st.walking=P.st.walkingFlag&&d>.01;
    let dy=((P.yaw-P.A.root.rotation.y+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;P.A.root.rotation.y+=dy*Math.min(1,dt*8);
    if(P.st.wave>0)P.st.wave-=dt;animAvatar(P.A,dt,now,P.st);}
}
